<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <title>FotoRea</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <header class="ust">
    <button id="btnAc" class="dugme">Fotoğraf aç</button>
    <div class="ust-sag">
      <button id="btnGeri" class="ikon" title="Geri al" disabled>↶</button>
      <button id="btnSifirla" class="ikon" title="Sıfırla" disabled>⟲</button>
      <button id="btnKaydet" class="dugme vurgu" disabled>Kaydet</button>
    </div>
  </header>

  <main class="sahne" id="sahne">
    <div class="bos" id="bos">
      <div class="bos-ikon">◐</div>
      <p>Düzenlemek için bir fotoğraf seçin</p>
      <button id="btnAc2" class="dugme vurgu">Galeriden seç</button>
    </div>
    <canvas id="tuval" hidden></canvas>
    <div class="ipucu" id="ipucu" hidden>Orijinali görmek için basılı tutun</div>
  </main>

  <section class="panel" id="panel" hidden>
    <div class="sekme-icerik" data-sekme="filtre">
      <div class="seritler" id="filtreler"></div>
      <label class="kaydirici"><span>Yoğunluk</span><input type="range" id="filtreYogunluk" min="0" max="100" value="100"><output></output></label>
    </div>

    <div class="sekme-icerik" data-sekme="ayar" hidden>
      <label class="kaydirici"><span>Parlaklık</span><input type="range" data-p="parlaklik" min="-100" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Kontrast</span><input type="range" data-p="kontrast" min="-100" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Doygunluk</span><input type="range" data-p="doygunluk" min="-100" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Sıcaklık</span><input type="range" data-p="sicaklik" min="-100" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Ton</span><input type="range" data-p="ton" min="-100" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Gölgeler</span><input type="range" data-p="golge" min="-100" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Vurgular</span><input type="range" data-p="vurgu" min="-100" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Netlik</span><input type="range" data-p="netlik" min="0" max="100" value="0"><output></output></label>
    </div>

    <div class="sekme-icerik" data-sekme="rotus" hidden>
      <label class="kaydirici"><span>Cilt yumuşatma</span><input type="range" data-p="yumusatma" min="0" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Cilt ışıltısı</span><input type="range" data-p="isilti" min="0" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Yüz aydınlatma</span><input type="range" data-p="aydinlat" min="0" max="100" value="0"><output></output></label>
      <p class="not">Rötuş, fotoğraftaki ten renklerini otomatik bulur; arka plan etkilenmez.</p>
    </div>

    <div class="sekme-icerik" data-sekme="kirp" hidden>
      <div class="seritler" id="oranlar"></div>
      <div class="satir">
        <button class="dugme" id="btnDondur">Döndür ⟳</button>
        <button class="dugme" id="btnCevir">Yatay çevir ⇋</button>
      </div>
    </div>

    <div class="sekme-icerik" data-sekme="efekt" hidden>
      <label class="kaydirici"><span>Vinyet</span><input type="range" data-p="vinyet" min="0" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Film greni</span><input type="range" data-p="gren" min="0" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Soluklaştır</span><input type="range" data-p="soluk" min="0" max="100" value="0"><output></output></label>
      <label class="kaydirici"><span>Rüya (parlama)</span><input type="range" data-p="parlama" min="0" max="100" value="0"><output></output></label>
    </div>

    <div class="sekme-icerik" data-sekme="ai" hidden>
      <div class="ai-liste">
        <button class="ai-kart" data-ai="arkaplan"><b>Arka planı sil / değiştir</b><small>Yapay zekâ servisi bağlanınca açılır</small></button>
        <button class="ai-kart" data-ai="kalite"><b>Kalite artır (netleştir, büyüt)</b><small>Yapay zekâ servisi bağlanınca açılır</small></button>
        <button class="ai-kart" data-ai="portre"><b>AI portre stilleri</b><small>Yapay zekâ servisi bağlanınca açılır</small></button>
        <button class="ai-kart" data-ai="sil"><b>Nesne silme</b><small>Yapay zekâ servisi bağlanınca açılır</small></button>
      </div>
    </div>

    <nav class="sekmeler" id="sekmeler">
      <button data-sekme="filtre" class="secili">Filtre</button>
      <button data-sekme="ayar">Ayarla</button>
      <button data-sekme="rotus">Rötuş</button>
      <button data-sekme="kirp">Kırp</button>
      <button data-sekme="efekt">Efekt</button>
      <button data-sekme="ai">AI</button>
    </nav>
  </section>

  <input type="file" id="dosya" accept="image/*" hidden>
  <div class="bildirim" id="bildirim" hidden></div>

  <script src="islem.js"></script>
  <script src="ai.js"></script>
  <script src="uygulama.js"></script>
</body>
</html>
