<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Notebook Asistan</title>
<style>
:root{
  --bg:#0e0f14; --bg2:#14161d; --panel:#181a23; --panel2:#1f2230; --line:#2a2e3d;
  --tx:#e9ebf3; --tx2:#a3a8bb; --tx3:#6c7186;
  --a1:#7c5cff; --a2:#22d3ee; --a3:#f472b6;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --r:16px;
}
[data-theme=light]{
  --bg:#f5f6fb; --bg2:#eceef6; --panel:#ffffff; --panel2:#f2f3f9; --line:#e1e4ee;
  --tx:#171a26; --tx2:#545a70; --tx3:#8b90a5; --shadow:0 10px 40px rgba(40,50,90,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);
  font-size:14.5px;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* arka plan ışıkları */
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora i{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.18;animation:float 22s ease-in-out infinite}
.aurora i:nth-child(1){background:var(--a1);left:-120px;top:-160px}
.aurora i:nth-child(2){background:var(--a2);right:-160px;bottom:-200px;animation-delay:-7s}
.aurora i:nth-child(3){background:var(--a3);left:45%;top:40%;width:380px;height:380px;opacity:.09;animation-delay:-13s}
[data-theme=light] .aurora i{opacity:.12}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.1)}66%{transform:translate(-40px,30px) scale(.95)}}

.app{position:relative;z-index:1;display:flex;height:100%}

/* kenar çubuğu */
aside{width:270px;flex:none;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg2) 82%,transparent);
  backdrop-filter:blur(20px);border-right:1px solid var(--line);transition:margin .35s cubic-bezier(.2,.8,.2,1)}
aside.hide{margin-left:-270px}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px color-mix(in srgb,var(--a1) 45%,transparent);flex:none}
.logo svg{width:20px;height:20px}
.brand b{font-size:15.5px;letter-spacing:.2px}.brand small{display:block;color:var(--tx3);font-size:11.5px;margin-top:1px}
.search{margin:4px 14px 10px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:9px 12px 9px 34px;font:inherit;outline:none;transition:border .2s,box-shadow .2s}
.search input:focus{border-color:var(--a1);box-shadow:0 0 0 3px color-mix(in srgb,var(--a1) 25%,transparent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;color:var(--tx3)}
.label{padding:6px 20px;color:var(--tx3);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.nblist{flex:1;overflow:auto;padding:2px 10px 10px}
.nb{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;margin:2px 0;
  color:var(--tx2);transition:background .2s,color .2s,transform .2s;position:relative;animation:slideIn .45s both}
.nb:hover{background:var(--panel2);color:var(--tx);transform:translateX(2px)}
.nb.on{background:var(--panel);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.nb.on::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad)}
.nb .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.nb .t{font-size:13.3px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:12px}
.foot .sp{flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);transition:background .2s,color .2s,transform .15s}
.iconbtn:hover{background:var(--panel2);color:var(--tx)}.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:18px;height:18px}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* ana alan */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(16px)}
header h1{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:13px;transition:all .2s}
.pill:hover{border-color:var(--a1);transform:translateY(-1px);box-shadow:0 6px 18px color-mix(in srgb,var(--a1) 20%,transparent)}
.pill svg{width:15px;height:15px}
.chat{flex:1;overflow:auto;scroll-behavior:smooth}
.inner{max-width:820px;margin:0 auto;padding:26px 24px 30px}

/* boş durum */
.empty{text-align:center;padding-top:7vh;animation:fadeUp .6s both}
.orb{width:92px;height:92px;margin:0 auto 22px;border-radius:50%;background:conic-gradient(from 0deg,var(--a1),var(--a2),var(--a3),var(--a1));
  animation:spin 8s linear infinite;position:relative;filter:drop-shadow(0 10px 30px color-mix(in srgb,var(--a1) 50%,transparent))}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.orb span{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:34px;animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.empty h2{font-size:27px;font-weight:650;letter-spacing:-.4px}
.empty h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;color:transparent}
.empty p{color:var(--tx2);margin:8px 0 26px}
.sugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;text-align:left}
.sug{padding:14px 15px;border-radius:14px;background:var(--panel);border:1px solid var(--line);transition:all .25s;animation:fadeUp .5s both;line-height:1.4}
.sug b{display:block;font-size:13.5px;margin-bottom:4px}
.sug span{color:var(--tx2);font-size:12.8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sug:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--a1) 60%,var(--line));box-shadow:var(--shadow)}
.skel{height:74px;border-radius:14px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* mesajlar */
.msg{display:flex;gap:12px;margin:0 0 22px;animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
.msg.me{justify-content:flex-end}
.me .bub{background:var(--grad);color:#fff;border-radius:18px 18px 4px 18px;padding:11px 16px;max-width:78%;white-space:pre-wrap;line-height:1.5;
  box-shadow:0 8px 24px color-mix(in srgb,var(--a1) 30%,transparent)}
.av{width:32px;height:32px;border-radius:10px;background:var(--grad);flex:none;display:grid;place-items:center;margin-top:2px}
.av svg{width:17px;height:17px}
.bot .card{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:15px 18px;line-height:1.65}
.card p{margin:0 0 10px}.card p:last-child{margin:0}
.card h3{font-size:15.5px;margin:14px 0 6px}.card h3:first-child{margin-top:0}
.card ul,.card ol{margin:4px 0 10px 22px}.card li{margin:4px 0}.card li::marker{color:var(--a1)}
.card blockquote{border-left:3px solid var(--a1);background:color-mix(in srgb,var(--a1) 8%,transparent);border-radius:0 12px 12px 0;padding:10px 14px;margin:6px 0 12px}
.card strong{color:var(--tx);font-weight:650}
.card table{border-collapse:collapse;margin:8px 0 12px;font-size:13.4px;width:100%}
.card th,.card td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}.card th{background:var(--panel2)}
.reveal>*{animation:fadeUp .45s both}
.cite{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin:0 1px;border-radius:7px;font-size:10.5px;font-weight:700;
  vertical-align:2px;background:color-mix(in srgb,var(--a1) 18%,transparent);color:color-mix(in srgb,var(--a1) 70%,var(--tx));cursor:help;transition:all .15s}
.cite:hover{background:var(--a1);color:#fff;transform:translateY(-1px)}
.tools{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.tbtn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3);padding:5px 9px;border-radius:8px;transition:all .2s}
.tbtn:hover{background:var(--panel2);color:var(--tx)}.tbtn svg{width:14px;height:14px}
.next{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{font-size:12.8px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);color:var(--tx2);background:var(--panel2);transition:all .2s;text-align:left;animation:fadeUp .4s both}
.chip:hover{color:var(--tx);border-color:var(--a1);transform:translateY(-2px)}
.err{border-color:color-mix(in srgb,#ef4444 60%,var(--line))!important;color:#f87171}

/* yazıyor */
.typing{display:flex;align-items:center;gap:12px;color:var(--tx2);font-size:13px}
.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--grad);animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-7px);opacity:1}}
.typing span{transition:opacity .3s}

/* yazma alanı */
.composer{padding:10px 24px 18px}
.box{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:9px 9px 9px 16px;
  box-shadow:var(--shadow);transition:border .25s,box-shadow .25s}
.box:focus-within{border-color:color-mix(in srgb,var(--a1) 70%,var(--line));box-shadow:var(--shadow),0 0 0 4px color-mix(in srgb,var(--a1) 18%,transparent)}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--tx);font:inherit;line-height:1.5;max-height:180px;padding:7px 0}
textarea::placeholder{color:var(--tx3)}
.send{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;transition:transform .2s,opacity .2s,filter .2s}
.send:hover{transform:scale(1.07) rotate(-6deg);filter:brightness(1.1)}.send:active{transform:scale(.92)}
.send:disabled{opacity:.35;transform:none;cursor:default}.send svg{width:19px;height:19px}
.hint{max-width:820px;margin:7px auto 0;text-align:center;color:var(--tx3);font-size:11.5px}

/* açılış */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{text-align:center}
.sp-logo{width:84px;height:84px;margin:0 auto 24px;border-radius:24px;background:var(--grad);display:grid;place-items:center;position:relative;animation:pulse 2s ease-in-out infinite}
.sp-logo svg{width:42px;height:42px}
.sp-logo::before,.sp-logo::after{content:"";position:absolute;inset:-10px;border-radius:30px;border:2px solid var(--a1);opacity:0;animation:ring 2s ease-out infinite}
.sp-logo::after{animation-delay:1s}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes ring{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.4)}}
.sp-in h2{font-size:22px;font-weight:650}.sp-in p{color:var(--tx2);margin-top:8px;min-height:20px;transition:opacity .3s}
.bar{width:220px;height:4px;border-radius:4px;background:var(--panel2);margin:22px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:var(--grad);border-radius:4px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.retry{margin-top:20px;display:none}

/* güncelleme kartı */
#upd{position:fixed;right:22px;bottom:22px;z-index:40;width:340px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);transform:translateY(140%) scale(.9);opacity:0;
  transition:transform .6s cubic-bezier(.2,1.3,.3,1),opacity .4s;overflow:hidden}
#upd.show{transform:none;opacity:1}
#upd::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}
.u-top{display:flex;gap:12px;align-items:flex-start}
.u-ic{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none;animation:rock 2.4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) translateY(-2px)}75%{transform:rotate(8deg)}}
.u-ic svg{width:21px;height:21px}
.u-top b{font-size:14.5px}.u-top small{display:block;color:var(--tx2);font-size:12.3px;margin-top:2px}
.u-notes{color:var(--tx2);font-size:12.5px;margin:10px 0 0;max-height:90px;overflow:auto;white-space:pre-wrap;line-height:1.45;background:var(--panel2);border-radius:10px;padding:8px 10px}
.u-act{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;padding:9px;border-radius:11px;font-size:13px;font-weight:600;transition:all .2s}
.btn.pri{background:var(--grad);color:#fff}.btn.pri:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.sec{background:var(--panel2);color:var(--tx2)}.btn.sec:hover{color:var(--tx)}
.u-prog{display:none;margin-top:13px}.u-prog .track{height:7px;border-radius:7px;background:var(--panel2);overflow:hidden}
.u-prog .fill{height:100%;width:0;background:var(--grad);border-radius:7px;transition:width .25s}
.u-prog small{display:flex;justify-content:space-between;color:var(--tx2);font-size:12px;margin-top:6px}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;background:var(--panel);border:1px solid var(--line);padding:9px 16px;border-radius:12px;
  box-shadow:var(--shadow);font-size:13px;transition:all .35s cubic-bezier(.2,1.3,.3,1);z-index:45;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{position:fixed;z-index:60;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;
  color:var(--tx2);box-shadow:var(--shadow);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
#tip.show{opacity:1;transform:none}
#tip b{color:var(--tx);display:block;margin-bottom:3px;font-size:12px}
@media (max-width:760px){aside{position:absolute;z-index:20;height:100%;box-shadow:var(--shadow)}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<div id="splash"><div class="sp-in">
  <div class="sp-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12a1 1 0 0 1 1 1v13H6.5A2.5 2.5 0 0 0 4 19.5Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H19v-5"/><path d="m12 7 .9 1.9L15 9.8l-2.1.9L12 12.6l-.9-1.9L9 9.8l2.1-.9Z"/></svg></div>
  <h2>Notebook Asistan</h2>
  <p id="spStatus">Başlatılıyor…</p>
  <div class="bar" id="spBar"><i></i></div>
  <button class="pill retry" id="retry" onclick="boot()" style="margin:20px auto 0">Tekrar dene</button>
</div></div>

<div class="app">
  <aside id="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12a1 1 0 0 1 1 1v13H6.5A2.5 2.5 0 0 0 4 19.5Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H19v-5"/></svg></div>
      <div><b>Notebook Asistan</b><small>Gemini Notebook istemcisi</small></div>
    </div>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Defter ara…" oninput="renderList()"></div>
    <div class="label">Defterler</div>
    <div class="nblist" id="list"></div>
    <div class="foot">
      <span id="ver">v—</span><span class="sp"></span>
      <button class="iconbtn" title="Güncellemeleri denetle" onclick="checkUpdate(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="iconbtn" title="Tema" onclick="toggleTheme()" id="themeBtn"></button>
    </div>
  </aside>

  <main>
    <header>
      <button class="iconbtn" title="Kenar çubuğu" onclick="side.classList.toggle('hide')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <h1 id="title">—</h1>
      <button class="pill" onclick="newChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Yeni sohbet</button>
    </header>
    <div class="chat" id="chat"><div class="inner" id="inner"></div></div>
    <div class="composer">
      <div class="box">
        <textarea id="inp" rows="1" placeholder="Deftere bir soru sor…"></textarea>
        <button class="send" id="send" onclick="send()" title="Gönder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="hint">Enter gönderir · Shift+Enter yeni satır · Cevaplar yalnızca defterdeki kaynaklara dayanır</div>
    </div>
  </main>
</div>

<div id="upd">
  <div class="u-top">
    <div class="u-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></div>
    <div><b id="uTitle">Yeni sürüm hazır</b><small id="uSub"></small></div>
  </div>
  <div class="u-notes" id="uNotes"></div>
  <div class="u-act" id="uAct">
    <button class="btn sec" onclick="hideUpd()">Sonra</button>
    <button class="btn pri" onclick="doUpdate()">Şimdi güncelle</button>
  </div>
  <div class="u-prog" id="uProg"><div class="track"><div class="fill" id="uFill"></div></div><small><span id="uTxt">İndiriliyor…</span><span id="uPct">0%</span></small></div>
</div>
<div id="toast"></div>
<div id="tip"></div>

<script>
const $=s=>document.querySelector(s);
const ICONS={
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  bot:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9Z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
};
const COLORS=['#7c5cff','#22d3ee','#f472b6','#34d399','#f59e0b','#60a5fa','#a78bfa','#fb7185'];
let S={notebooks:[],sel:null,busy:false,theme:'dark'};

/* ---------- Python'dan çağrılanlar ---------- */
window.ui={
  splashStatus(t){const p=$('#spStatus');p.style.opacity=0;setTimeout(()=>{p.textContent=t;p.style.opacity=1},200)},
  updateProgress(p){$('#uFill').style.width=p+'%';$('#uPct').textContent=p+'%';if(p>=100)$('#uTxt').textContent='Kuruluyor, yeniden başlatılıyor…'}
};

/* ---------- açılış ---------- */
function api(){return window.pywebview.api}
window.addEventListener('pywebviewready',boot);
async function boot(){
  $('#retry').style.display='none';$('#spBar').style.display='';
  ui.splashStatus('Başlatılıyor…');
  const r=await api().boot();
  setTheme(r.theme||'dark',false);
  $('#ver').textContent=r.version==='dev'?'geliştirme':'v'+r.version;
  if(!r.ok){ui.splashStatus(r.error);$('#spBar').style.display='none';$('#retry').style.display='flex';return}
  S.notebooks=r.notebooks;S.sel=r.selected;
  renderList();openNotebook(S.sel,false);
  $('#splash').classList.add('out');
  $('#inp').focus();
  const up=await api().just_updated();
  if(up)toast('🎉  v'+up+' sürümüne güncellendi');
  setTimeout(()=>checkUpdate(false),2500);
  if(r.autoask)setTimeout(()=>ask(r.autoask),800);
}

/* ---------- tema ---------- */
function setTheme(t,save=true){S.theme=t;document.documentElement.dataset.theme=t;$('#themeBtn').innerHTML=t==='dark'?ICONS.sun:ICONS.moon;if(save)api().set_theme(t)}
function toggleTheme(){setTheme(S.theme==='dark'?'light':'dark')}

/* ---------- defter listesi ---------- */
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderList(){
  const f=$('#q').value.toLocaleLowerCase('tr');
  $('#list').innerHTML=S.notebooks.filter(n=>n.title.toLocaleLowerCase('tr').includes(f)).map((n,i)=>{
    const ix=S.notebooks.indexOf(n),c=COLORS[ix%COLORS.length];
    return `<button class="nb ${n.id===S.sel?'on':''}" style="animation-delay:${i*40}ms" onclick="openNotebook('${n.id}')">
      <span class="ic" style="background:linear-gradient(135deg,${c},${c}99)">${esc(n.title.trim()[0]||'?').toLocaleUpperCase('tr')}</span>
      <span class="t">${esc(n.title)}</span></button>`}).join('');
}
function curTitle(){return (S.notebooks.find(n=>n.id===S.sel)||{}).title||''}
function openNotebook(id,save=true){
  S.sel=id;if(save)api().select(id);renderList();
  $('#title').textContent=curTitle();showEmpty();
}
async function newChat(){
  if(S.busy)return;showEmpty();toast('✨  Yeni sohbet başladı');api().new_chat(S.sel);
}

/* ---------- boş durum + öneriler ---------- */
async function showEmpty(){
  const id=S.sel;
  $('#inner').innerHTML=`<div class="empty"><div class="orb"><span>📚</span></div>
    <h2>Ne <em>öğrenmek</em> istersin?</h2><p>${esc(curTitle())}</p>
    <div class="sugs" id="sugs">${'<div class="skel"></div>'.repeat(4)}</div></div>`;
  const s=await api().suggest(id);
  if(S.sel!==id||!$('#sugs'))return;
  $('#sugs').innerHTML=s.length?s.map((x,i)=>`<button class="sug" style="animation-delay:${i*70}ms" data-p="${esc(x.prompt)}"><b>${esc(x.title)}</b><span>${esc(x.prompt)}</span></button>`).join(''):'';
  document.querySelectorAll('.sug').forEach(b=>b.onclick=()=>ask(b.dataset.p));
}

/* ---------- markdown ---------- */
function inline(t,refs){
  t=esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>');
  return t.replace(/\[(\d[\d,\s\-–]*)\]/g,(m,g)=>{
    const nums=[];g.split(',').forEach(p=>{const r=p.split(/[-–]/).map(x=>parseInt(x));if(r.length===2&&r[1]>=r[0]&&r[1]-r[0]<30)for(let k=r[0];k<=r[1];k++)nums.push(k);else if(!isNaN(r[0]))nums.push(r[0])});
    return nums.map(n=>`<span class="cite" data-n="${n}">${n}</span>`).join('');
  });
}
function md(text,refs){
  const raw=text.split(String.fromCharCode(13)).join('').split('\n');let out='',buf=[],q=[];
  const flushQ=()=>{out+=md0(buf.join('\n'),refs);buf=[];out+='<blockquote>'+md0(q.join('\n'),refs)+'</blockquote>';q=[]};
  for(const l of raw){const m=l.match(/^\s*>\s?(.*)$/);if(m)q.push(m[1]);else{if(q.length)flushQ();buf.push(l)}}
  if(q.length)flushQ();out+=md0(buf.join('\n'),refs);return out;
}
function md0(text,refs){
  const L=text.split('\n');let h='',list=null,tbl=null;
  const close=()=>{if(list){h+=`</${list}>`;list=null}if(tbl){h+='</table>';tbl=null}};
  for(let line of L){
    const t=line.trim();
    if(/^\|.*\|$/.test(t)){
      if(/^\|[\s:\-|]+\|$/.test(t))continue;
      const cells=t.slice(1,-1).split('|').map(c=>inline(c.trim(),refs));
      if(!tbl){close();h+='<table>';tbl=1;h+='<tr>'+cells.map(c=>`<th>${c}</th>`).join('')+'</tr>'}else h+='<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>';
      continue}
    let m;
    if(m=t.match(/^#{1,6}\s+(.*)/)){close();h+=`<h3>${inline(m[1],refs)}</h3>`}
    else if(m=t.match(/^[*\-•]\s+(.*)/)){if(list!=='ul'){close();h+='<ul>';list='ul'}h+=`<li>${inline(m[1],refs)}</li>`}
    else if(m=t.match(/^\d+[.)]\s+(.*)/)){if(list!=='ol'){close();h+='<ol>';list='ol'}h+=`<li>${inline(m[1],refs)}</li>`}
    else if(!t){close()}
    else{close();h+=`<p>${inline(t,refs)}</p>`}
  }
  close();return h;
}

/* ---------- sohbet ---------- */
const inp=$('#inp');
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,180)+'px'});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function send(){const q=inp.value.trim();if(!q)return;inp.value='';inp.style.height='auto';ask(q)}
function scrollEnd(){const c=$('#chat');c.scrollTop=c.scrollHeight}
function add(html,cls){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;$('#inner').appendChild(d);scrollEnd();return d}

const THINK=['Kaynaklar taranıyor…','İlgili bölümler bulunuyor…','Cevap hazırlanıyor…','Atıflar ekleniyor…'];
async function ask(q){
  if(S.busy)return;
  if($('.empty'))$('#inner').innerHTML='';
  S.busy=true;$('#send').disabled=true;
  add(`<div class="bub">${esc(q)}</div>`,'me');
  const t=add(`<div class="av">${ICONS.bot}</div><div class="card"><div class="typing"><div class="dots"><i></i><i></i><i></i></div><span>${THINK[0]}</span></div></div>`,'bot');
  let k=0;const iv=setInterval(()=>{const s=t.querySelector('.typing span');if(!s)return;s.style.opacity=0;setTimeout(()=>{s.textContent=THINK[++k%THINK.length];s.style.opacity=1},300)},2600);
  const nb=S.sel;
  const r=await api().ask(nb,q);
  clearInterval(iv);S.busy=false;$('#send').disabled=false;
  const card=t.querySelector('.card');
  if(!r.ok){card.classList.add('err');card.innerHTML=`⚠️ ${esc(r.error)}<div class="tools"><button class="tbtn">${ICONS.redo}Tekrar dene</button></div>`;
    card.querySelector('.tbtn').onclick=()=>{t.previousSibling.remove();t.remove();ask(q)};return}
  card.classList.add('reveal');card.dataset.refs=JSON.stringify(r.refs||{});
  card.innerHTML=md(r.answer||'(boş cevap)',r.refs);
  [...card.children].forEach((el,i)=>el.style.animationDelay=(i*70)+'ms');
  const tools=document.createElement('div');tools.className='tools';
  tools.innerHTML=`<button class="tbtn">${ICONS.copy}<span>Kopyala</span></button>`;
  tools.firstChild.onclick=async e=>{await api().copy(r.answer);const s=e.currentTarget.querySelector('span');s.textContent='Kopyalandı ✓';setTimeout(()=>s.textContent='Kopyala',1600)};
  card.appendChild(tools);
  if(r.next&&r.next.length){const n=document.createElement('div');n.className='next';
    n.innerHTML=r.next.map((x,i)=>`<button class="chip" style="animation-delay:${300+i*90}ms">${esc(x)}</button>`).join('');
    n.querySelectorAll('.chip').forEach(c=>c.onclick=()=>ask(c.textContent));card.appendChild(n)}
  const c=$('#chat');c.scrollTop=t.offsetTop-90;
}

/* ---------- atıf ipucu ---------- */
const tip=$('#tip');
document.addEventListener('mouseover',e=>{
  const c=e.target.closest('.cite');if(!c){tip.classList.remove('show');return}
  const refs=JSON.parse(c.closest('.card').dataset.refs||'{}');let txt=refs[c.dataset.n]||'Kaynak metni yok';
  if(txt.length>420)txt=txt.slice(0,420)+'…';
  tip.innerHTML=`<b>Kaynak ${c.dataset.n}</b>${esc(txt)}`;
  const b=c.getBoundingClientRect();tip.classList.add('show');
  const w=tip.offsetWidth,hh=tip.offsetHeight;
  tip.style.left=Math.max(10,Math.min(innerWidth-w-10,b.left-w/2+b.width/2))+'px';
  tip.style.top=(b.top-hh-8<10?b.bottom+8:b.top-hh-8)+'px';
});

/* ---------- bildirim ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- güncelleme ---------- */
async function checkUpdate(manual){
  if(manual)toast('🔎  Güncellemeler denetleniyor…');
  const u=await api().check_update();
  if(!u){if(manual)toast('✅  En güncel sürümü kullanıyorsun');return}
  $('#uTitle').textContent='Yeni sürüm hazır · v'+u.version;
  $('#uSub').textContent='Şu anki: v'+u.current+' · '+u.size+' MB';
  $('#uNotes').textContent=u.notes||'Hata düzeltmeleri ve iyileştirmeler.';
  $('#uAct').style.display='flex';$('#uProg').style.display='none';
  $('#upd').classList.add('show');
}
function hideUpd(){$('#upd').classList.remove('show')}
async function doUpdate(){
  $('#uAct').style.display='none';$('#uProg').style.display='block';$('#uTxt').textContent='İndiriliyor…';
  const r=await api().do_update();
  if(!r.ok){$('#uTxt').textContent='Hata: '+r.error;setTimeout(()=>{$('#uAct').style.display='flex';$('#uProg').style.display='none'},3000)}
}
</script>
