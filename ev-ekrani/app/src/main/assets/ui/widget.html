<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ev Ekranı bölümü</title>
<style>
/* Ana ekranın ortasındaki saydam bölüm (EvWidget): solda Fenerbahçe kartı, sağda günün menüleri ve hava durumu.
   Yükseklik ekrana göre değişir; yazılar rem ile, rem de kartın yüksekliğiyle ölçeklenir (yerlesim). */
@font-face{font-family:Outfit;src:url(outfit.ttf);font-weight:100 900}
:root{--sari:#ffd200;--lacivert:#0b1f4d;--yazi:#fff;--soluk:rgba(255,255,255,.62);--cam:rgba(255,255,255,.08);--cizgi:rgba(255,255,255,.14);
  --raf:240px;font-size:16px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:transparent;color:var(--yazi);font-family:Outfit,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none}
#sahne{position:absolute;inset:0;display:flex;gap:1.5rem;align-items:flex-start}

/* ---------- Fenerbahçe kartı ---------- */
#sol{flex:0 0 min(27rem,47%);height:var(--raf);perspective:1400px;transition:height .35s cubic-bezier(.2,.8,.2,1)}
/* Odaktayken dock başlığı gizlenir; kart da fotoğraf gibi bölümün altına kadar uzar. */
#sol.odak{height:100%}
#kart{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,1.25,.45,1)}
#kart.don{transform:rotateY(180deg)}
.yuz{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.4rem;overflow:hidden;
  padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.55rem;
  background:linear-gradient(150deg,rgba(18,40,96,.78),rgba(8,20,52,.72));border:1px solid var(--cizgi);
  box-shadow:0 1.2rem 2.6rem rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.16);transition:box-shadow .2s,transform .2s}
.yuz::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 3.2rem,rgba(255,210,0,.035) 3.2rem 6.4rem);pointer-events:none}
.arka{transform:rotateY(180deg)}
.bas,.etiket,.mac,.meta,.sayac,.son,.skor,.dugmeler{flex-shrink:0}
/* Kart kısayken (odakta değil) geri sayım sığmazsa gizlenir. */
/* Kart kısayken içerik sığmazsa sırayla geri sayım, tarih satırı ve lig etiketi gizlenir (sigdir). */
#sol.s1 .sayac,#sol.s2 .on .meta,#sol.s3 .on .etiket{display:none}
/* Dönerken yüzeyden geçen ışık */
.yuz::after{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);
  transform:translateX(-100%);pointer-events:none}
#kart.parla .yuz::after{animation:isik .9s ease-out}
@keyframes isik{to{transform:translateX(100%)}}
#sol.odak .on,#sol.odak .arka{box-shadow:0 0 0 .19rem rgba(255,255,255,.92),0 0 2.2rem rgba(255,210,0,.35),0 1.2rem 2.6rem rgba(0,0,0,.4)}
.bas{display:flex;align-items:center;gap:.7rem;position:relative}
.serit{width:2rem;height:2rem;border-radius:.55rem;flex:none;background:repeating-linear-gradient(90deg,var(--sari) 0 .34rem,var(--lacivert) .34rem .68rem);box-shadow:0 0 0 .12rem var(--sari)}
.bas h2{margin:0;font-weight:600;font-size:1.25rem;letter-spacing:.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ipucuk{font-size:.72rem;color:var(--soluk);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.etiket{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sari);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.canli{display:inline-block;background:#e0262b;color:#fff;border-radius:.3rem;padding:0 .4rem;margin-left:.4rem;letter-spacing:.08em}
.mac{display:flex;align-items:center;justify-content:space-between;gap:.6rem;font-weight:600;font-size:1.3rem;line-height:1.1;position:relative}
.mac span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mac span:last-child{text-align:right}
.mac .vs{flex:none;font-weight:300;color:var(--soluk);font-size:1.1rem}
.biz{color:var(--sari)}
.meta{font-size:.85rem;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.sayac{display:flex;gap:.45rem;position:relative}
.sayac div{flex:1;background:rgba(0,0,0,.25);border-radius:.7rem;padding:.3rem 0;text-align:center}
.sayac b{display:block;font-weight:500;font-size:1.45rem;line-height:1}
.sayac span{font-size:.6rem;color:var(--soluk);letter-spacing:.1em;text-transform:uppercase}
.son{margin-top:auto;display:flex;align-items:center;gap:.7rem;padding:.45rem .6rem;border-radius:.8rem;background:var(--cam);position:relative}
.rozet{min-width:3rem;text-align:center;font-weight:600;font-size:1rem;border-radius:.45rem;padding:.15rem .4rem;flex:none;background:rgba(255,255,255,.14)}
.rozet.g{background:#1f9d55}.rozet.b{background:#7d8491}.rozet.m{background:#c0392b}
.son .ad{font-size:.85rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.son .ad small{color:var(--soluk)}
.bos{font-size:.95rem;color:var(--soluk);line-height:1.45;position:relative}

/* Arka yüz: son maçın özeti */
.skor{display:flex;align-items:center;gap:.6rem;font-weight:600;font-size:1.15rem;position:relative}
.skor span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skor span:last-child{text-align:right}
.skor b{flex:none;font-weight:600;font-size:1.9rem;line-height:1;padding:.1rem .7rem;border-radius:.6rem;background:rgba(0,0,0,.28);letter-spacing:.04em}
.goller{display:grid;grid-template-columns:1fr 1fr;gap:.15rem 1rem;font-size:.85rem;flex:1;min-height:0;overflow:hidden;align-content:start;position:relative}
.goller div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goller .dep{text-align:right}
.goller i{font-style:normal;color:var(--sari);font-weight:600;margin:0 .3rem}
.goller small{color:var(--soluk)}
.dugmeler{display:flex;gap:.6rem;position:relative}
.dugme{flex:1;display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.5rem .4rem;border-radius:.8rem;
  background:rgba(255,255,255,.1);font-weight:500;font-size:.9rem;white-space:nowrap;transition:background .15s,color .15s,transform .15s}
.dugme svg{width:1rem;height:1rem;flex:none}
.dugme.secili{background:var(--sari);color:var(--lacivert);transform:scale(1.04)}

/* ---------- Günün menüleri ----------
   Her gün 5 menü, yemek.com'dan (kutunun sunucusu /api/menu); internet yoksa yemekler.json yedeği.
   Kart resimle yavaşça yakınlaşır, menüler kayarak değişir; OK'a basınca kart döner, arkasında tarif. */
#sag{flex:1;height:100%;display:flex;justify-content:flex-end;min-width:0;perspective:1600px}
#yemek{position:relative;height:100%;width:100%;max-width:38rem;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.2,.45,1)}
#yemek.don{transform:rotateY(180deg)}
.ykart{position:absolute;inset:0;border-radius:1.4rem;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:#1a1410;box-shadow:0 1.2rem 2.6rem rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.14);transition:box-shadow .2s}
#yemek.odak .ykart{box-shadow:0 0 0 .19rem rgba(255,255,255,.92),0 0 2.4rem rgba(255,170,60,.3),0 1.2rem 2.6rem rgba(0,0,0,.45)}
.ytarif{transform:rotateY(180deg);background:linear-gradient(160deg,#2b1d12,#160e08)}
/* Menü sahneleri: biri görünürken diğeri yandan kayarak gelir. */
.ysahne{position:absolute;inset:0;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity 1s ease,filter 1s ease}
.ysahne.gir{transform:translateX(18%) scale(1.06);opacity:0;filter:blur(6px)}
.ysahne.cik{transform:translateX(-14%) scale(.94);opacity:0;filter:blur(6px)}
.yresim{position:absolute;inset:0;background:center/cover no-repeat;animation:yakin 14s ease-in-out infinite alternate}
@keyframes yakin{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2%,-2%)}}
.yresim.yok{animation:none;background:radial-gradient(120% 100% at 30% 20%,#e0832f 0%,#8f3d14 45%,#2a1209 100%)}
.yresim.yok::after{content:"🍽";position:absolute;right:8%;top:12%;font-size:5rem;opacity:.35}
.ygolge{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 30%,transparent 45%,rgba(0,0,0,.82) 100%)}
.yalt{position:absolute;left:0;right:0;bottom:0;padding:1rem 1.2rem .9rem}
.yetiket{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#ffc56b;font-weight:600}
.yad{font-size:1.9rem;font-weight:600;line-height:1.05;margin:.2rem 0 .3rem;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.ybilgi{font-size:.85rem;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yipucu{position:absolute;right:1.2rem;bottom:1rem;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);
  background:rgba(0,0,0,.35);border-radius:.5rem;padding:.2rem .5rem;opacity:0;transition:opacity .25s}
#yemek.odak .yipucu{opacity:1}
#hava{position:absolute;left:1rem;top:.8rem;font-size:.95rem;font-weight:500;white-space:nowrap;padding:.25rem .6rem;border-radius:.7rem;
  background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#hava small{color:var(--soluk);font-weight:400}
.nk{position:absolute;top:1.05rem;right:1rem;display:flex;gap:.35rem}
.nk i{width:.42rem;height:.42rem;border-radius:50%;background:rgba(255,255,255,.4);transition:width .3s,background .3s}
.nk i.on{background:#ffc56b;width:1.2rem;border-radius:.3rem}
/* Tarif yüzü */
.tbas{position:relative;height:5.2rem;flex:none;overflow:hidden}
.tbas .yresim{animation:none;filter:brightness(.55)}
.tbas div.tbaslik{position:absolute;left:1.2rem;bottom:.6rem;right:1.2rem}
.tbaslik b{display:block;font-size:1.45rem;font-weight:600;line-height:1.1}
.tbaslik span{font-size:.75rem;color:rgba(255,255,255,.75)}
.ytarif{display:flex;flex-direction:column}
.tgovde{position:relative;flex:1;min-height:0;overflow:hidden;padding:.7rem 1.2rem 0}
#tic{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:1.2rem;transition:transform .35s ease}
.tgovde h4{margin:0 0 .35rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#ffc56b;font-weight:600}
.tgovde ul,.tgovde ol{margin:0;padding:0;list-style:none;font-size:.82rem;line-height:1.35}
.tgovde ul li{padding:.12rem 0 .12rem .8rem;position:relative}
.tgovde ul li::before{content:"";position:absolute;left:0;top:.6em;width:.3rem;height:.3rem;border-radius:50%;background:#ffc56b}
.tgovde ol{counter-reset:a}
.tgovde ol li{counter-increment:a;padding:.15rem 0 .3rem 1.5rem;position:relative}
.tgovde ol li::before{content:counter(a);position:absolute;left:0;top:.15rem;width:1.1rem;height:1.1rem;border-radius:50%;background:rgba(255,197,107,.18);
  color:#ffc56b;font-size:.65rem;font-weight:600;display:flex;align-items:center;justify-content:center}
.tsis{position:absolute;left:0;right:0;bottom:0;height:2.2rem;background:linear-gradient(transparent,#170f09);pointer-events:none}
.tipucu{flex:none;font-size:.68rem;color:rgba(255,255,255,.55);padding:.35rem 1.2rem .6rem;text-align:right}
</style>
</head>
<body>
<div id="sahne">
  <div id="sol">
    <div id="kart">
      <section class="yuz on">
        <div class="bas"><div class="serit"></div><h2>Fenerbahçe</h2><span class="ipucuk" id="okIpucu"></span></div>
        <div id="onIcerik" style="display:contents"></div>
      </section>
      <section class="yuz arka">
        <div id="arkaIcerik" style="display:contents"></div>
        <div class="dugmeler">
          <div class="dugme" id="b0"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>Maç özetini izle</div>
          <div class="dugme" id="b1"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 6h-7.6l3.3-3.3-.7-.7L12 6 8 2l-.7.7L10.6 6H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 13H3V8h18z"/></svg>FB TV</div>
        </div>
      </section>
    </div>
  </div>
  <div id="sag">
    <div id="yemek">
      <section class="ykart yon">
        <div id="sahneler"></div>
        <div id="hava"></div>
        <div class="nk" id="nk"></div>
        <div class="yipucu">OK · Tarif</div>
      </section>
      <section class="ykart ytarif">
        <div class="tbas"><div class="yresim" id="tresim"></div><div class="tbaslik" id="tbaslik"></div></div>
        <div class="tgovde"><div id="tic"></div><div class="tsis"></div></div>
        <div class="tipucu">Yukarı / Aşağı kaydırır · Geri döner</div>
      </section>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const Tv=window.Tv||{ust(){},dock(){},ac(u){console.log('ac',u)}};
async function api(yol){const r=await fetch('/api/'+yol);if(!r.ok)throw new Error(r.status);return r.json()}
let durum={feeds:{}};

/* ---------- Yerleşim: kartın yüksekliği (raf) Java'dan gelir ---------- */
let raf=0;
window.yerlesim=r=>{raf=r;const H=innerHeight||r;const k=Math.max(110,Math.min(r||H,H));
  document.documentElement.style.setProperty('--raf',k+'px');
  // Yazı boyu: tam boy kartta (bölüm yüksekliği) 15 satır, kısa kartta geri sayımsız içerik sığacak kadar.
  const f=Math.max(10.5,Math.min(17,H/15,k/11.6));
  document.documentElement.style.fontSize=f+'px';
  boyut();sigdir()};
addEventListener('resize',()=>yerlesim(raf));

/* ---------- Hava ---------- */
const HAVA={0:'Açık',1:'Az bulutlu',2:'Parçalı bulutlu',3:'Bulutlu',45:'Sisli',48:'Sisli',51:'Çisenti',53:'Çisenti',55:'Çisenti',61:'Hafif yağmur',63:'Yağmurlu',65:'Kuvvetli yağmur',71:'Kar',73:'Kar',75:'Yoğun kar',80:'Sağanak',81:'Sağanak',82:'Kuvvetli sağanak',95:'Gök gürültülü',96:'Dolu',99:'Dolu'};
function havaCiz(){const w=durum.feeds&&durum.feeds.weather;$('hava').innerHTML=w?`Mersin ${Math.round(w.temp)}° <small>${HAVA[w.code]||''}</small>`:'Mersin'}

/* ---------- Fenerbahçe kartı ---------- */
const fb=n=>/Fenerbah/i.test(n);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const takim=n=>fb(n)?`<span class="biz">${esc(n)}</span>`:`<span>${esc(n)}</span>`;
const tz={timeZone:'Europe/Istanbul'};
const gun=t=>new Date(t).toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long',...tz});
const kisaGun=t=>new Date(t).toLocaleDateString('tr-TR',{day:'numeric',month:'long',...tz});
const sa=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',...tz});
const sonuc=x=>{const b=fb(x.home)?+x.hs:+x.as,o=fb(x.home)?+x.as:+x.hs;return b>o?'g':b<o?'m':'b'};
let macSaati=0,sonMac=null;
function kartCiz(){const m=durum.feeds&&durum.feeds.matches,on=$('onIcerik');
  if(!m){macSaati=0;sonMac=null;on.innerHTML='<div class="bos">Maç bilgileri internetten bekleniyor.</div>';arkaCiz();return}
  const n=m.next||[],l=m.last||[];sonMac=l[0]||null;let h='';
  if(n[0]){const x=n[0];macSaati=x.live?0:x.t;
    h+=`<div class="etiket">${x.live?'Şu an oynanıyor':'Sıradaki maç'} · ${esc(x.comp)}${x.live?'<span class="canli">CANLI</span>':''}</div>
      <div class="mac">${takim(x.home)}<b class="vs">${x.live?esc(x.hs+' - '+x.as):'VS'}</b>${takim(x.away)}</div>
      <div class="meta">${gun(x.t)} · ${sa(x.t)}${x.venue?' · '+esc(x.venue):''}</div>
      ${x.live?'':'<div class="sayac" id="sayac"><div><b>-</b><span>Gün</span></div><div><b>-</b><span>Saat</span></div><div><b>-</b><span>Dakika</span></div></div>'}`}
  else{macSaati=0;h+='<div class="bos">Yaklaşan maç bulunamadı.</div>'}
  if(sonMac){const x=sonMac;h+=`<div class="son"><div class="rozet ${sonuc(x)}">${esc(x.hs)}-${esc(x.as)}</div><div class="ad">${esc(x.home)} - ${esc(x.away)} <small>· Son maç</small></div></div>`}
  on.innerHTML=h;$('okIpucu').textContent=sonMac?'OK · Maç özeti':'';sayacGuncelle();arkaCiz();sigdir()}
function sigdir(){const sol=$('sol'),on=document.querySelector('.on');if(!on)return;
  // Ölçüm için geçişsiz: kartın varacağı yükseklikte dene.
  const t=sol.style.transition;sol.style.transition='none';sol.classList.remove('s1','s2','s3');
  for(const c of ['s1','s2','s3']){if(on.scrollHeight<=on.clientHeight+1)break;sol.classList.add(c)}
  void sol.offsetHeight;sol.style.transition=t}
function arkaCiz(){const x=sonMac,el=$('arkaIcerik');
  if(!x){el.innerHTML='<div class="bas"><div class="serit"></div><h2>Son maç</h2></div><div class="bos">Son maç bilgisi henüz yok.</div>';return}
  const g=x.goals||[],ev=g.filter(a=>a.side==='home'),dep=g.filter(a=>a.side==='away');
  const not=a=>a.note==='pen'?' <small>(P)</small>':a.note==='kk'?' <small>(K.K.)</small>':'';
  let satir='';for(let i=0;i<Math.max(ev.length,dep.length);i++){const a=ev[i],b=dep[i];
    satir+=`<div>${a?`<i>${esc(a.min)}</i>${esc(a.name)}${not(a)}`:''}</div><div class="dep">${b?`${esc(b.name)}${not(b)}<i>${esc(b.min)}</i>`:''}</div>`}
  if(!g.length)satir=`<div style="grid-column:1/3;color:var(--soluk)">${x.goals?'Golsüz bitti.':'Gol bilgisi bekleniyor.'}</div>`;
  el.innerHTML=`<div class="etiket">Son maç · ${esc(x.comp)} · ${kisaGun(x.t)}</div>
    <div class="skor">${takim(x.home)}<b>${esc(x.hs)} - ${esc(x.as)}</b>${takim(x.away)}</div>
    <div class="goller">${satir}</div>`}
function sayacGuncelle(){const b=document.querySelectorAll('#sayac b');if(!b.length||!macSaati)return;const f=Math.max(0,macSaati-Date.now());
  b[0].textContent=Math.floor(f/864e5);b[1].textContent=String(Math.floor(f/36e5)%24).padStart(2,'0');b[2].textContent=String(Math.floor(f/6e4)%60).padStart(2,'0')}
setInterval(sayacGuncelle,10000);
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
function ozetAdresi(){const x=sonMac;return yt(x?`${x.home} ${x.away} maç özeti`:'Fenerbahçe maç özeti')}

/* ---------- Günün menüleri ---------- */
let yemekler=[],gunun=[],ysira=0,ydegisim=Date.now();
const resimler={};try{Object.assign(resimler,JSON.parse(localStorage.getItem('yemekResim')||'{}'))}catch(e){}
function gunNo(){return Math.floor((Date.now()+3*3600e3)/864e5)}   // İstanbul saatine göre gün
let sonGun=-1;
/* Günün menüsü kutunun kendi sunucusundan gelir (/api/menu: her gün yemek.com'dan 5 tarif, resimleriyle). */
async function sunucuMenu(g){const r=await fetch('/api/menu');if(!r.ok)throw new Error(r.status);const j=await r.json();
  return (j.g===g&&j.m&&j.m.length===5)?j.m:[]}
function karistir(l,tohum){const a=l.slice();let x=tohum*2654435761>>>0;
  for(let i=a.length-1;i>0;i--){x=(x*1103515245+12345)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let yukleniyor=false,sonDeneme=0;
async function gununMenuleri(){const g=gunNo();
  if(g===sonGun||yukleniyor||(gunun.length&&Date.now()-sonDeneme<6e4))return;yukleniyor=true;sonDeneme=Date.now();
  try{let m=[];try{m=await sunucuMenu(g)}catch(e){}
    // Sunucunun menüsü henüz hazır değilse kutudaki yedek liste gösterilir; 1 dakika sonra yeniden denenir.
    if(m.length===5)sonGun=g;
    else{if(!yemekler.length)return;const k=karistir(yemekler,Math.floor(g/7)),bas=(g%7)*5;for(let i=0;m.length<5;i++)m.push(k[(bas+i)%k.length])}
    const ayni=gunun.length&&gunun.map(x=>x.ad).join()===m.map(x=>x.ad).join();
    if(!ayni){gunun=m;ysira=0;menuGoster(0,!$('sahneler').children.length)}
  }finally{yukleniyor=false}}
/* Vikipedi özet servisi: yemeğin resmi (küçük boyutu büyütülerek). Bulunanlar kutuda saklanır. */
async function resimBul(y){const k=y.wiki;if(y.resim)return y.resim;if(k in resimler)return resimler[k];
  for(const [dil,baslik] of [['tr',y.wiki],['en',y.en||y.wiki]]){
    try{const r=await fetch(`https://${dil}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(baslik.replace(/ /g,'_'))}`);if(!r.ok)continue;
      const j=await r.json();let u=j.thumbnail&&j.thumbnail.source;
      if(u)u=u.replace(/\/(\d+)px-/,'/960px-');else if(j.originalimage)u=j.originalimage.source;
      if(u){resimler[k]=u;try{localStorage.setItem('yemekResim',JSON.stringify(resimler))}catch(e){}return u}}catch(e){}}
  return null}
const yuklu=src=>new Promise(ok=>{const i=new Image();i.onload=()=>ok(true);i.onerror=()=>ok(false);i.src=src});
async function resimKoy(el,y){const u=await resimBul(y);
  if(u&&await yuklu(u)){el.style.backgroundImage=`url("${u}")`;el.classList.remove('yok')}
  else if(u&&u.includes('/960px-')){const o=u.replace('/960px-','/500px-');if(await yuklu(o)){el.style.backgroundImage=`url("${o}")`;el.classList.remove('yok');resimler[y.wiki]=o}}}
function menuGoster(i,ilk){if(!gunun.length)return;ysira=(i+gunun.length)%gunun.length;const y=gunun[ysira],kap=$('sahneler');
  const s=document.createElement('div');s.className='ysahne'+(ilk?'':' gir');
  s.innerHTML=`<div class="yresim yok"></div><div class="ygolge"></div><div class="yalt"><div class="yetiket">Günün menüsü · ${ysira+1}/5</div>
    <div class="yad">${esc(y.ad)}</div><div class="ybilgi">${esc(bilgi(y))}</div></div>`;
  resimKoy(s.querySelector('.yresim'),y);
  for(const e of kap.children){e.classList.add('cik');setTimeout(()=>e.remove(),1100)}
  kap.appendChild(s);if(!ilk)requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.remove('gir')));
  $('nk').innerHTML=gunun.map((_,j)=>`<i class="${j===ysira?'on':''}"></i>`).join('');ydegisim=Date.now();tarifCiz()}
function bilgi(y){const b=[];if(y.yaninda)b.push('Yanında: '+y.yaninda);if(y.sure)b.push(y.sure);if(y.kisi)b.push(y.kisi+' kişilik');else if(y.miktar)b.push(y.miktar);
  if(y.kaynak)b.push(y.kaynak);return b.join(' · ')||'Tarif için OK'}
function tarifCiz(){const y=gunun[ysira];if(!y)return;
  $('tbaslik').innerHTML=`<b>${esc(y.ad)}</b><span>${esc(bilgi(y))}</span>`;
  const t=$('tresim');t.className='yresim yok';t.style.backgroundImage='';resimKoy(t,y);
  $('tic').innerHTML=`<div><h4>Malzemeler</h4><ul>${y.malzeme.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>
    <div><h4>Yapılışı</h4><ol>${y.yapilis.map(m=>`<li>${esc(m)}</li>`).join('')}</ol></div>`;tKay=0;kaydir(0)}
let tKay=0;
function kaydir(d){const ic=$('tic'),kap=ic.parentElement;const en=Math.max(0,ic.scrollHeight-kap.clientHeight+24);
  tKay=Math.max(0,Math.min(en,tKay+d));ic.style.transform=`translateY(${-tKay}px)`}
let ydonuk=false;
function yemekCevir(d){if(ydonuk===d)return;ydonuk=d;$('yemek').classList.toggle('don',d);if(d){tKay=0;kaydir(0)}ydegisim=Date.now()}
setInterval(()=>{gununMenuleri();if(!ydonuk&&gunun.length&&Date.now()-ydegisim>9000)menuGoster(ysira+1)},1000);
fetch('yemekler.json').then(r=>r.json()).then(j=>{yemekler=j;gununMenuleri()}).catch(()=>{});
function boyut(){}

/* ---------- Kumanda ----------
   Odak sırası: Fenerbahçe kartı (ya da arkasındaki iki düğme), sonra günün menüsü. Yukarı üst çubuğa, Aşağı dock'a gider.
   Menüde Sağ sonraki menü, OK tarif; tarifte Yukarı/Aşağı kaydırır, OK ya da Geri karta döner. */
let odak=null,donuk=false,donusZamani=null;
function goster(){const o=$('sol').classList.contains('odak');$('sol').classList.toggle('odak',odak==='kart'||odak==='b0'||odak==='b1');
  if(o!==$('sol').classList.contains('odak'))setTimeout(sigdir,400);$('yemek').classList.toggle('odak',odak==='yemek');
  $('b0').classList.toggle('secili',odak==='b0');$('b1').classList.toggle('secili',odak==='b1')}
function cevir(d){if(donuk===d)return;donuk=d;const k=$('kart');k.classList.toggle('don',d);k.classList.remove('parla');void k.offsetWidth;k.classList.add('parla');
  clearTimeout(donusZamani);if(d)donusZamani=setTimeout(()=>{if(!odak)cevir(false)},90000)}
window.odaklan=()=>{odak=donuk?'b0':'kart';goster()};
window.birak=()=>{odak=null;cevir(false);yemekCevir(false);goster()};
window.geri=()=>{if(ydonuk){yemekCevir(false);odak='yemek';goster()}else if(donuk){cevir(false);odak='kart';goster()}else{odak=null;goster();Tv.dock()}};
window.gorundu=()=>{yenile();gununMenuleri()};
addEventListener('keydown',e=>{if(!odak)return;const k=e.key;
  if(k==='Enter'||k===' '){e.preventDefault();if(e.repeat)return;
    if(odak==='kart'){cevir(true);odak='b0'}
    else if(odak==='b0')Tv.ac(ozetAdresi());
    else if(odak==='b1')Tv.ac(yt('FB TV Fenerbahçe'));
    else if(odak==='yemek')yemekCevir(!ydonuk);
    goster();return}
  if(!k.startsWith('Arrow'))return;e.preventDefault();
  if(odak==='yemek'&&ydonuk){if(k==='ArrowDown')kaydir(60);else if(k==='ArrowUp')kaydir(-60);else{yemekCevir(false);if(k==='ArrowLeft'){odak=donuk?'b1':'kart'}goster()}return}
  if(k==='ArrowUp'){odak=null;goster();Tv.ust();return}
  if(k==='ArrowDown'){odak=null;goster();Tv.dock();return}
  const sag=k==='ArrowRight';
  if(odak==='kart'){if(sag)odak='yemek'}
  else if(odak==='b0'){odak=sag?'b1':'b0'}
  else if(odak==='b1'){odak=sag?'yemek':'b0'}
  else if(odak==='yemek'){if(sag)menuGoster(ysira+1);else odak=donuk?'b1':'kart'}
  goster()});

/* ---------- Veri ---------- */
async function yenile(){try{durum=await api('state');kartCiz();havaCiz()}catch(e){}}
yerlesim(innerHeight);yenile();setInterval(yenile,20000);
</script>
