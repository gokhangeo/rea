<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ataç</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="serit" class="serit">
      <div class="ust" id="suruk">
        <button id="kapat" class="yuvar" title="Gizle">×</button>
        <button id="ekle" class="yuvar" title="Ekle">+</button>
      </div>

      <div id="ekleMenu" class="ekle-menu gizli">
        <button data-mode="folder"><span>📁</span> Klasör ekle</button>
        <button data-mode="file"><span>📄</span> Dosya ekle</button>
      </div>

      <button class="amblem" id="klips" title="Ataç'ı aç / kapat">
        <img src="assets/atac-clip.png" alt="Ataç" draggable="false" />
      </button>

      <button id="sayacSatir" class="sayac-satir" title="Listeyi aç/kapat">
        <span id="chevron" class="chevron">⌃</span>
        <span id="sayac">0 Öğe</span>
      </button>

      <div class="ayrac"></div>

      <div class="kaydir" id="kaydir">
        <ul id="liste" class="liste"></ul>
        <div id="bos" class="bos">
          <div class="bos-daire">+</div>
          <p>Sürükle<br />ya da + ile ekle</p>
        </div>
      </div>

      <div id="alt" class="alt gizli">
        <div id="tumunu" class="tumunu" draggable="true" title="Hepsini birden sürükle">⇪ Tümü</div>
        <button id="temizle" class="temizle" title="Hepsini kaldır">🗑</button>
      </div>

      <div id="atilan" class="atilan"></div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
