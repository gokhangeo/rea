# foto-editor/ klasöründeki FotoRea uygulamasını bulutta derler:
#   - Android: doğrudan telefona kurulabilen FotoRea.apk (ubuntu)
#   - iOS: imzasız FotoRea.ipa (macOS), iPhone'a SideStore / iloader ile kurulur
# Çıktılar Actions sayfasındaki ilgili çalışmanın "Artifacts" bölümünden indirilir.
name: FotoRea derle (apk + ipa)

on:
  workflow_dispatch:
  push:
    paths:
      - "foto-editor/**"
      - ".github/workflows/foto-editor.yml"
  pull_request:
    paths:
      - "foto-editor/**"
      - ".github/workflows/foto-editor.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foto-editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini oluştur
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: APK derle
        working-directory: foto-editor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FotoRea.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FotoRea-apk
          path: foto-editor/FotoRea.apk

  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: foto-editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        run: npm install

      - name: iOS projesini oluştur
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios

      - name: Fotoğraf izin metinlerini ekle
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Düzenlemek istediğiniz fotoğrafı seçmek için.'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Düzenlenen fotoğrafı galerinize kaydetmek için.'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Düzenlemek için fotoğraf çekmek amacıyla.'" $PLIST

      - name: İmzasız derle
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: .ipa paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr FotoRea.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FotoRea-ipa
          path: foto-editor/FotoRea.ipa
