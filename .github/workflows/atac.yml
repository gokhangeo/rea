name: Ataç Windows

on:
  push:
    paths:
      - "atac/**"
      - ".github/workflows/atac.yml"
  workflow_dispatch:
    inputs:
      yayinla:
        description: "GitHub sürümü yayınla (otomatik güncelleme için)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: atac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        run: npm install

      - name: Derle (veya sürüm yayınla)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.yayinla }}" = "true" ] || [[ "${{ github.ref }}" == refs/tags/atac-v* ]]; then
            echo "Sürüm yayınlanıyor (otomatik güncelleme dosyalarıyla)"
            npm run yayinla
          else
            echo "Yalnızca derleme (yayın yok)"
            npm run dist
          fi

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: atac-windows
          path: |
            atac/dist/*.exe
          if-no-files-found: error
