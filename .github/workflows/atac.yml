name: Ataç Windows

on:
  push:
    paths:
      - "atac/**"
      - ".github/workflows/atac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: atac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        run: npm install

      - name: Windows exe üret (per-user kurulum + taşınabilir)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: atac-windows
          path: |
            atac/dist/*.exe
          if-no-files-found: error

      - name: Sürüm yayınla (yalnızca atac-v* etiketinde)
        if: startsWith(github.ref, 'refs/tags/atac-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            atac/dist/*.exe
          fail_on_unmatched_files: true
