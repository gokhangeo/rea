name: Kutu Kurucu APK

on:
  push:
    paths:
      - "kutu-kurucu/**"
      - ".github/workflows/kutu-kurucu.yml"
  workflow_dispatch:
  # İmza anahtarı depoda: kutu-kurucu/kutu-kurucu.jks (parola kutukurucu). Böylece her sürüm aynı
  # anahtarla imzalanır ve yeni APK eskisinin üstüne kurulabilir.

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kutu-kurucu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK derle
        run: ./gradlew --no-daemon :app:assembleRelease :kurulum:assembleRelease
      - name: İmza anahtarını doğrula
        run: |
          "$JAVA_HOME/bin/keytool" -list -v -keystore kutu-kurucu.jks -storepass kutukurucu | grep -m1 SHA256
      - name: APK adını düzenle
        run: |
          cp app/build/outputs/apk/release/app-release.apk "KutuKurucu-1.${GITHUB_RUN_NUMBER}.apk"
          cp kurulum/build/outputs/apk/release/kurulum-release.apk "KutuKurucu-Kurulum.apk"
      - name: Sürüm notu
        run: |
          git log -1 --format=%s > notlar.txt
          echo "" >> notlar.txt
          echo "İki TV kutusuna telefondan/PC'den APK kurma ve ana ekran seçme aracı. Kurulum: depodaki kutu-kurucu/README.md." >> notlar.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KutuKurucu-apk
          path: kutu-kurucu/KutuKurucu-*.apk
      - name: Sürüm yayınla (yalnızca main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kutu-kurucu-v1.${{ github.run_number }}
          name: Kutu Kurucu 1.${{ github.run_number }}
          make_latest: false
          files: |
            kutu-kurucu/KutuKurucu-*.apk
            kutu-kurucu/KutuKurucu-Kurulum.apk
            kutu-kurucu/pc/Kutuya-Gonder.bat
            kutu-kurucu/pc/kutuya-gonder.ps1
            kutu-kurucu/pc/ilk-kurulum.bat
          body_path: kutu-kurucu/notlar.txt
