# Atac (Python surumu) Windows'ta derlenir.
# - atac-py-v* etiketi gonderilince: exe'yi o etiketin GitHub Release'ine yukler.
# - Elle calistirinca (workflow_dispatch) "surum" verilirse: o surumle derler,
#   etiketi+release'i runner uzerinde olusturur (yerel etiket push'u gerekmez).
#   "surum" bos ise yalnizca derler (artifact).
# - PR'da: sadece derler (birlestirme oncesi dogrulama).
name: Ataç (Python)

on:
  push:
    tags: ['atac-py-v*']
  pull_request:
    paths:
      - "atac-py/**"
      - ".github/workflows/atac-py.yml"
  workflow_dispatch:
    inputs:
      surum:
        description: "Yayınlanacak sürüm (ör. 0.1). Boş bırakılırsa yalnızca derlenir."
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Derle
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          ATAC_VERSION: ${{ (github.event_name == 'workflow_dispatch' && inputs.surum != '' && format('atac-py-v{0}', inputs.surum)) || (startsWith(github.ref, 'refs/tags/atac-py-v') && github.ref_name) || 'dev' }}
        run: atac-py\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: Atac
          path: atac-py/dist/Atac.exe
          if-no-files-found: error

      - name: Release'e yükle
        if: ${{ startsWith(github.ref, 'refs/tags/atac-py-v') || (github.event_name == 'workflow_dispatch' && inputs.surum != '') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ (startsWith(github.ref, 'refs/tags/atac-py-v') && github.ref_name) || format('atac-py-v{0}', inputs.surum) }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Ataç (Python) ${TAG#atac-py-v}" \
              --notes "Ayrıntılar: [atac-py/README.md](https://github.com/${{ github.repository }}/tree/main/atac-py)"
          fi
          gh release upload "$TAG" atac-py/dist/Atac.exe --clobber
