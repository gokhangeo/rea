name: Ev Ekranı APK

on:
  push:
    paths:
      - "ev-ekrani/**"
      - ".github/workflows/ev-ekrani.yml"
  workflow_dispatch:
  # İmza anahtarı Actions önbelleğinde durur ve 7 gün dokunulmazsa silinir; silinirse yeni APK eskisinin
  # üstüne kurulamaz. Bu zamanlanmış çalışma yalnızca önbelleği okuyup canlı tutar.
  schedule:
    - cron: "17 3 */4 * *"

permissions:
  contents: write

jobs:
  anahtari-canli-tut:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ev-ekrani-debug-keystore

  derle:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ev-ekrani
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # İmza anahtarı: gizli değer tanımlıysa o, değilse önbellekte saklanan hata ayıklama anahtarı.
      # İkisi de her derlemede aynı anahtarı verir; böylece yeni APK eskisinin üstüne kurulur.
      - name: İmza anahtarını hazırla
        env:
          EV_KEYSTORE_B64: ${{ secrets.EV_KEYSTORE_B64 }}
        run: |
          true  # anahtar depoda: ev-ekrani/ev-ekrani.jks
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ev-ekrani-debug-keystore
      - name: APK derle
        env:
        run: ./gradlew --no-daemon assembleRelease
      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk "EvEkrani-0.2.${GITHUB_RUN_NUMBER}.apk"
      # Sürüm notunun ilk satırı kutudaki "Güncelleme hazır" penceresinde "Yenilikler" olarak görünür.
      - name: Sürüm notu
        run: |
          git log -1 --format=%s > notlar.txt
          echo "" >> notlar.txt
          echo "Xiaomi TV kutusu için Ev Ekranı. Kurulum için depodaki ev-ekrani/README.md dosyasına bakın." >> notlar.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EvEkrani-apk
          path: ev-ekrani/EvEkrani-*.apk
      - name: Sürüm yayınla (yalnızca main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ev-ekrani-v0.2.${{ github.run_number }}
          name: Ev Ekranı 0.2.${{ github.run_number }}
          files: ev-ekrani/EvEkrani-*.apk
          body_path: ev-ekrani/notlar.txt
