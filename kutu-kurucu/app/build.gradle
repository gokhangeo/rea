plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNumber = System.getenv('GITHUB_RUN_NUMBER') ?: '1'

android {
    namespace 'com.gokhan.kutukurucu'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gokhan.kutukurucu'
        minSdk 26
        targetSdk 34
        versionCode runNumber.toInteger()
        versionName "1.${runNumber}"
    }

    // Her sürüm aynı anahtarla imzalanmalı ki yeni APK eskisinin üstüne kurulabilsin. Anahtar depoda
    // kutu-kurucu/kutu-kurucu.jks olarak durur (bu araç için parolası kutukurucu). KUTU_KEYSTORE_PASS
    // verilirse o parola kullanılır.
    def keystore = rootProject.file('kutu-kurucu.jks')
    def keystorePass = System.getenv('KUTU_KEYSTORE_PASS') ?: (keystore.exists() ? 'kutukurucu' : null)

    if (keystore.exists() && keystorePass) {
        signingConfigs {
            kutu {
                storeFile keystore
                storePassword keystorePass
                keyAlias System.getenv('KUTU_KEY_ALIAS') ?: 'kutukurucu'
                keyPassword keystorePass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.findByName('kutu') ?: signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain 17
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
